name: Unit tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-${{ runner.os }}-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            protobuf-c-compiler \
            protobuf-compiler \
            libprotobuf-c-dev  \
            git \
            python3 \
            python3-pip \
            python3-dev \
            build-essential \
            pkg-config \
            libsocketcan-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libcsp
        run: |
          git clone --depth 1 --branch v1.6 https://github.com/libcsp/libcsp
          cd libcsp
          ./waf configure --enable-can-socketcan
          ./waf
          cd ..

      - name: Run unit tests
        run: |
          mkdir build
          make test TEST=config CSP_REPO_DIR=./libcsp
